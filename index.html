<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Varshita Illa | Full Stack Developer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ---------- Tokens ---------- */
:root{
    --bg:#fafaf9;
    --surface:#ffffff;
    --surface-2:#f4f4f7;
    --text:#14141f;
    --muted:#5b5b70;
    --border:#e6e6ee;
    --accent:#4f46e5;
    --accent-hover:#4338ca;
    --accent-soft:#eef0ff;
    --on-accent:#ffffff;
    --shadow-sm:0 1px 2px rgba(20,20,31,.05);
    --shadow-md:0 12px 30px -12px rgba(49,46,129,.22);
    --radius-sm:8px;
    --radius:14px;
    --radius-lg:22px;
    --space-section:clamp(4rem,9vw,7rem);
    --gutter:clamp(1.25rem,5vw,2rem);
    --maxw:1120px;
    --font:'Manrope','Segoe UI',system-ui,-apple-system,sans-serif;
    --header-h:68px;
    color-scheme:light;
}
body.dark-mode{
    --bg:#0e0f1a;
    --surface:#161826;
    --surface-2:#1c1f31;
    --text:#ececf5;
    --muted:#a2a4bb;
    --border:#2a2d44;
    --accent:#8b8dff;
    --accent-hover:#a5a7ff;
    --accent-soft:#1f2140;
    --on-accent:#0e0f1a;
    --shadow-sm:none;
    --shadow-md:0 12px 30px -12px rgba(0,0,0,.6);
    color-scheme:dark;
}

/* ---------- Base ---------- */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--header-h) + 12px);-webkit-text-size-adjust:100%}
body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--text);
    line-height:1.65;
    font-size:clamp(1rem,.96rem + .2vw,1.0625rem);
    overflow-x:hidden;
    transition:background-color .3s,color .3s;
}
img{display:block;max-width:100%}
a{color:var(--accent);text-underline-offset:3px}
a:hover{color:var(--accent-hover)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}

.container,
section,
nav,
footer p{max-width:var(--maxw);margin-inline:auto}
section{padding:var(--space-section) var(--gutter)}

section h2{
    font-size:clamp(1.6rem,1.2rem + 1.6vw,2.25rem);
    font-weight:800;
    letter-spacing:-.02em;
    line-height:1.15;
    color:var(--text);
    margin-bottom:clamp(1.75rem,4vw,2.75rem);
    text-align:left;
}

/* ---------- Header / Nav ---------- */
header{
    position:sticky;top:0;z-index:1000;
    background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:saturate(1.4) blur(10px);
    -webkit-backdrop-filter:saturate(1.4) blur(10px);
    border-bottom:1px solid var(--border);
}
nav{
    display:flex;align-items:center;gap:1rem;
    min-height:var(--header-h);
    padding:.5rem var(--gutter);
}
.logo{
    font-size:1.05rem;font-weight:800;letter-spacing:-.01em;
    color:var(--text);margin-right:auto;white-space:nowrap;
}
nav ul{display:flex;list-style:none;gap:.25rem}
nav ul li{margin:0}
nav ul li a{
    display:inline-flex;align-items:center;min-height:40px;
    padding:0 .9rem;border-radius:999px;
    text-decoration:none;color:var(--muted);
    font-weight:600;font-size:.94rem;
    transition:color .2s,background-color .2s;
}
nav ul li a:hover{color:var(--text);background:var(--surface-2)}
nav ul li a.active{color:var(--accent);background:var(--accent-soft)}

#theme-toggle{
    width:42px;height:42px;display:grid;place-items:center;
    background:var(--surface);color:var(--text);
    border:1px solid var(--border);border-radius:50%;
    font-size:1.05rem;line-height:1;cursor:pointer;
    transition:background-color .2s,border-color .2s;
}
#theme-toggle:hover{background:var(--surface-2);border-color:var(--accent)}

/* ---------- Hero ---------- */
.hero{
    min-height:calc(100svh - var(--header-h));
    display:flex;align-items:center;
    padding-block:clamp(3rem,7vw,5rem);
}
.hero-grid{
    width:100%;
    display:grid;
    grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr);
    gap:clamp(2rem,6vw,5rem);
    align-items:center;
}
.hero-text{order:1}
.profile-img{
    order:2;
    width:100%;max-width:340px;aspect-ratio:4/5;
    justify-self:end;
    object-fit:cover;
    border-radius:var(--radius-lg);
    border:1px solid var(--border);
    box-shadow:var(--shadow-md);
    animation:rise .8s cubic-bezier(.2,.7,.2,1) both;
}
.hero h1{
    font-size:clamp(2.4rem,1.4rem + 4.6vw,4.4rem);
    font-weight:800;letter-spacing:-.035em;line-height:1.04;
    margin-bottom:.9rem;
    animation:rise .7s cubic-bezier(.2,.7,.2,1) both;
}
.hero h1 span{font-weight:800}
#typing-text{
    min-height:1.6em;
    font-size:clamp(1.1rem,1rem + .6vw,1.35rem);
    font-weight:600;color:var(--accent);
    margin-bottom:1.25rem;
}
.hero p{
    max-width:56ch;margin:0 0 2rem;color:var(--muted);
}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ---------- Buttons ---------- */
.social-links{display:flex;flex-wrap:wrap;gap:.75rem;margin:0}
.social-links a,
.btn{
    display:inline-flex;align-items:center;justify-content:center;
    min-height:48px;padding:0 1.5rem;margin:0;
    border-radius:var(--radius-sm);
    font:inherit;font-weight:700;font-size:.97rem;
    text-decoration:none;cursor:pointer;
    transition:transform .2s,background-color .2s,border-color .2s,color .2s;
}
.social-links a{
    background:var(--surface);color:var(--text);
    border:1px solid var(--border);box-shadow:var(--shadow-sm);
}
.social-links a:first-child{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.social-links a:first-child:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:var(--on-accent)}
.social-links a:not(:first-child):hover{border-color:var(--accent);color:var(--accent)}
.btn{background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);margin-top:0}
.btn:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:var(--on-accent);transform:translateY(-2px)}

/* ---------- About ---------- */
.about-text{
    max-width:62ch;color:var(--muted);
    font-size:clamp(1.05rem,1rem + .4vw,1.2rem);line-height:1.75;
}

/* ---------- Skills ---------- */
.skills-container{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    gap:.75rem;
}
.card{
    display:flex;align-items:center;justify-content:center;
    min-height:56px;padding:.75rem 1rem;
    background:var(--surface);color:var(--text);
    border:1px solid var(--border);border-radius:var(--radius-sm);
    font-weight:600;font-size:.95rem;text-align:center;
    box-shadow:var(--shadow-sm);
    transition:border-color .2s,background-color .2s,color .2s;
}
.card:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);transform:none}

/* ---------- Projects ---------- */
.project-container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));
    gap:clamp(1rem,2.5vw,1.75rem);
}
.project-card{
    position:relative;display:flex;flex-direction:column;
    background:var(--surface);
    border:1px solid var(--border);border-radius:var(--radius);
    overflow:hidden;box-shadow:var(--shadow-sm);
    transition:transform .25s,box-shadow .25s,border-color .25s;
}
.project-card:hover,
.project-card:focus-within{transform:translateY(-4px);box-shadow:var(--shadow-md);border-color:var(--accent)}
.project-card img{
    width:100%;aspect-ratio:16/10;height:auto;object-fit:cover;
    background:var(--surface-2);border-bottom:1px solid var(--border);
}
.project-content{padding:1.35rem 1.4rem 1.5rem}
.project-content h3{font-size:1.15rem;font-weight:700;letter-spacing:-.01em;margin-bottom:.45rem}
.project-content h3 a{color:var(--text);text-decoration:none}
.project-content h3 a::after{content:"";position:absolute;inset:0}  /* whole card is clickable */
.project-card:hover h3 a{color:var(--accent)}
.project-content p{color:var(--muted);font-size:.96rem}

/* ---------- Education ---------- */
.education-card{
    max-width:640px;text-align:left;
    background:var(--surface);
    border:1px solid var(--border);border-left:4px solid var(--accent);
    border-radius:var(--radius);padding:1.5rem 1.75rem;
    box-shadow:var(--shadow-sm);
}
.education-card h3{font-size:1.2rem;font-weight:700;letter-s
