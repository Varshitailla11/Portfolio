<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Notes App</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f4f6fb;
    }

    /* TOP BAR */
    .top {
      background: #007bff;
      color: white;
      padding: 15px;
      text-align: center;
    }

    /* MAIN CONTAINER */
    .container {
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      padding: 10px 15px;
      margin-top: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    /* NOTE CARD (ONLY TITLE SHOWN) */
    .note {
      background: white;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
      border-left: 4px solid #007bff;
    }

    .note:hover {
      transform: scale(1.02);
      background: #eef5ff;
    }

    .date {
      font-size: 12px;
      color: gray;
      margin-top: 4px;
    }

    /* FULL SCREEN EDITOR */
    .editor {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background: white;
      padding: 20px;
      box-sizing: border-box;
    }

    .editor input {
      font-size: 20px;
      font-weight: bold;
    }

    .editor textarea {
      height: 65vh;
      font-size: 16px;
      margin-top: 10px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .delete {
      background: red;
    }

    .back {
      background: gray;
    }
  </style>
</head>

<body>

<div class="top">
  <h2>📒 Student Notes App</h2>
</div>

<div class="container">

  <h3>Create Note</h3>

  <input id="titleInput" placeholder="Enter Title..." />
  <textarea id="contentInput" placeholder="Write content..."></textarea>

  <button onclick="addNote()">➕ Add Note</button>

  <div id="notesList"></div>
</div>

<!-- FULL SCREEN EDITOR -->
<div class="editor" id="editor">

  <div class="topbar">
    <button class="back" onclick="closeEditor()">⬅ Back</button>
    <button class="delete" onclick="deleteNote()">🗑 Delete</button>
  </div>

  <input id="editTitle" />
  <textarea id="editContent"></textarea>

  <button onclick="saveEdit()">💾 Save Changes</button>
</div>

<script>
  let currentIndex = null;

  function getNotes() {
    return JSON.parse(localStorage.getItem("notes")) || [];
  }

  function saveNotes(notes) {
    localStorage.setItem("notes", JSON.stringify(notes));
  }

  function addNote() {
    let title = document.getElementById("titleInput").value;
    let content = document.getElementById("contentInput").value;

    if (title.trim() === "" || content.trim() === "") {
      alert("Title and Content required!");
      return;
    }

    let notes = getNotes();

    notes.push({
      title: title,
      content: content,
      date: new Date().toLocaleString()
    });

    saveNotes(notes);

    document.getElementById("titleInput").value = "";
    document.getElementById("contentInput").value = "";

    displayNotes();
  }

  function displayNotes() {
    let notes = getNotes();
    let list = document.getElementById("notesList");

    list.innerHTML = "";

    notes.forEach((note, index) => {
      list.innerHTML += `
        <div class="note" onclick="openEditor(${index})">
          <b>${note.title}</b>
          <div class="date">🕒 ${note.date}</div>
        </div>
      `;
    });
  }

  function openEditor(index) {
    currentIndex = index;

    let notes = getNotes();

    document.getElementById("editTitle").value = notes[index].title;
    document.getElementById("editContent").value = notes[index].content;

    document.getElementById("editor").style.display = "block";
  }

  function closeEditor() {
    document.getElementById("editor").style.display = "none";
  }

  function saveEdit() {
    let notes = getNotes();

    notes[currentIndex].title = document.getElementById("editTitle").value;
    notes[currentIndex].content = document.getElementById("editContent").value;

    saveNotes(notes);
    displayNotes();
    closeEditor();
  }

  function deleteNote() {
    let notes = getNotes();

    notes.splice(currentIndex, 1);

    saveNotes(notes);
    displayNotes();
    closeEditor();
  }

  displayNotes();
</script>

</body>
</html>
